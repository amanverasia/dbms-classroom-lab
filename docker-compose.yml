services:
  mariadb:
    build:
      context: ./docker/mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-classroom-root}
      MARIADB_DATABASE: college_demo
    ports:
      - "127.0.0.1:${DB_PORT:-3307}:3306"
    volumes:
      - classroom_db:/var/lib/mysql
      - mariadb_logs:/var/log/mysql
      - mariadb_certs:/etc/mysql/certs
      - ./database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 24

  adminer:
    image: adminer:4
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: mariadb
      ADMINER_DESIGN: nette
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8081}:8080"

  classroom-api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      PORT: "8080"
      DB_HOST: mariadb
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-classroom-root}
      CONSOLE_PASSWORD: ${CONSOLE_PASSWORD:-console-local-demo}
      DBA_PASSWORD: ${DBA_PASSWORD:-dba-local-demo}
      ADMINER_PORT: ${ADMINER_PORT:-8081}
      DB_PORT: ${DB_PORT:-3307}
    volumes:
      - mariadb_logs:/var/log/mysql:ro
      - mariadb_certs:/etc/mysql/certs:ro
      - classroom_db:/mnt/mariadb-data:ro
      - classroom_backups:/var/backups/classroom
      - ./database:/app/database:ro
      - ./tests:/app/tests:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20

  teacher-console:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      classroom-api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${CONSOLE_PORT:-8080}:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./server/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  classroom_db:
  mariadb_logs:
  mariadb_certs:
  classroom_backups:
